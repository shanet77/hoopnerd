services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hoopnerd.xyz,https://www.hoopnerd.xyz}
    expose:
      - "3001"
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://hoopnerd.xyz}
        NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-https://hoopnerd.xyz}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true

  db-seed:
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.seed
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true

networks:
  app_network:
    driver: bridge
