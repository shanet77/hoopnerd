services:
  postgres:
    image: postgres:18-alpine
    container_name: connectaball-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: connectaball_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  db-seed:
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.seed
    container_name: connectaball-db-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: connectaball_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./datasets:/app/datasets:ro
    networks:
      - app_network

  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:3000
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NEXT_PUBLIC_API_HOST=http://api:3001
    networks:
      - app_network
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - 3001:3001
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/connectaball_dev
      DB_HOST: postgres
      DB_NAME: connectaball_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
volumes:
  postgres_data:
networks:
  app_network:
    driver: bridge
