services:
  postgres:
    image: postgres:18-alpine
    container_name: hoopnerd-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: connectaball_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-seed:
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.seed
    container_name: hoopnerd-db-seed-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: connectaball_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./datasets:/app/datasets

volumes:
  postgres_data_dev:
