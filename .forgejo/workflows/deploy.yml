name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on:
      - linux-amd64
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://${repo_host}/${GITHUB_REPOSITORY}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "${repo_url}"
          else
            git remote set-url origin "${repo_url}"
          fi
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Bootstrap Node.js 22
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if ! command -v node >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/node"
            curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C "$HOME/.local/node" --strip-components=1
          fi
          export PATH="$HOME/.local/node/bin:$PATH"
          node --version
          npm --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          export PATH="$HOME/.local/node/bin:$PATH"
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          export PATH="$HOME/.local/node/bin:$PATH"
          pnpm -r --if-present run build

      - name: Test
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          export PATH="$HOME/.local/node/bin:$PATH"
          pnpm -r --if-present run test

  deploy_prod:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on:
      - linux-amd64
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://${repo_host}/${GITHUB_REPOSITORY}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "${repo_url}"
          else
            git remote set-url origin "${repo_url}"
          fi
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Deploy to Racknerd over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PATH_ON_VPS: ${{ secrets.PATH_ON_VPS }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          key_file=~/.ssh/prod_deploy_key
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          ssh -i "${key_file}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export DEPLOY_PATH='${DEPLOY_PATH}' PATH_ON_VPS='${PATH_ON_VPS}'; bash -s" \
            < scripts/deploy-racknerd.sh
