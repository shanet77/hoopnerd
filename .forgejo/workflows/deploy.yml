name: Deploy to VPS

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on:
      - forgejo
    steps:
      - name: Workflow disabled
        run: |
          echo "Docker build/push is disabled in Forgejo Actions for now."
          echo "Build and deploy manually on VPS:"
          echo "docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --remove-orphans"
