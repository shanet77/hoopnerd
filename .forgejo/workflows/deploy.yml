name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional existing image tag to deploy without rebuilding"
        required: false
        default: ""

jobs:
  test:
    runs-on:
      - linux-amd64
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://${repo_host}/${GITHUB_REPOSITORY}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "${repo_url}"
          else
            git remote set-url origin "${repo_url}"
          fi
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Bootstrap Node.js 22
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if ! command -v node >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/node"
            curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C "$HOME/.local/node" --strip-components=1
          fi
          export PATH="$HOME/.local/node/bin:$PATH"
          node --version
          npm --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          export PATH="$HOME/.local/node/bin:$PATH"
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          export PATH="$HOME/.local/node/bin:$PATH"
          pnpm -r --if-present run build

      - name: Test
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          export PATH="$HOME/.local/node/bin:$PATH"
          pnpm -r --if-present run test

  build_images_prod:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on:
      - linux-amd64
    outputs:
      image_tag: ${{ steps.resolve_image_tag.outputs.image_tag }}
      version: ${{ steps.resolve_version.outputs.version }}
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://${repo_host}/${GITHUB_REPOSITORY}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "${repo_url}"
          else
            git remote set-url origin "${repo_url}"
          fi
          git fetch --tags origin main
          git checkout --detach FETCH_HEAD

      - name: Resolve version
        id: resolve_version
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          VERSION="$(bash scripts/version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Resolve deployment image tag
        id: resolve_image_tag
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${IMAGE_TAG}"

      - name: Build and push images on dockernode
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '') }}
        env:
          DOCKERNODE_HOST: ${{ secrets.DOCKERNODE_HOST }}
          DOCKERNODE_USER: ${{ secrets.DOCKERNODE_USER }}
          DOCKERNODE_SSH_KEY: ${{ secrets.DOCKERNODE_SSH_KEY }}
          DOCKERNODE_PATH: ${{ secrets.DOCKERNODE_PATH }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE || vars.REGISTRY_NAMESPACE }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_HOST: ${{ vars.NEXT_PUBLIC_API_HOST }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          IMAGE_TAG: ${{ steps.resolve_image_tag.outputs.image_tag }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DOCKERNODE_HOST:?DOCKERNODE_HOST is required}"
          : "${DOCKERNODE_USER:?DOCKERNODE_USER is required}"
          : "${DOCKERNODE_SSH_KEY:?DOCKERNODE_SSH_KEY is required}"
          : "${DOCKERNODE_PATH:?DOCKERNODE_PATH is required}"
          : "${REGISTRY_URL:?REGISTRY_URL is required}"
          : "${REGISTRY_USERNAME:?REGISTRY_USERNAME is required}"
          : "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD is required}"
          : "${REGISTRY_NAMESPACE:?REGISTRY_NAMESPACE is required}"
          : "${VERSION:?VERSION is required}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          key_file=~/.ssh/dockernode_deploy_key
          printf '%s\n' "${DOCKERNODE_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          REPO_HOST="${GITHUB_SERVER_URL#https://}"
          REPO_URL="https://${REPO_HOST}/${GITHUB_REPOSITORY}.git"
          REGISTRY_HOST="${REGISTRY_URL#https://}"
          REGISTRY_HOST="${REGISTRY_HOST#http://}"
          REGISTRY_HOST="${REGISTRY_HOST%%/*}"
          REGISTRY_HOST="${REGISTRY_HOST%/}"
          echo "Using registry host: ${REGISTRY_HOST}"
          echo "Building version: ${VERSION}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REGISTRY_PASSWORD_B64="$(printf '%s' "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')"

          ssh -i "${key_file}" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o BatchMode=yes \
            "${DOCKERNODE_USER}@${DOCKERNODE_HOST}" \
            "export DOCKERNODE_PATH='${DOCKERNODE_PATH}' REPO_URL='${REPO_URL}' TARGET_SHA='${GITHUB_SHA}' IMAGE_TAG='${IMAGE_TAG}' VERSION='${VERSION}' BUILD_TIME='${BUILD_TIME}' GIT_SHA='${GIT_SHA}' REGISTRY_HOST='${REGISTRY_HOST}' REGISTRY_USERNAME='${REGISTRY_USERNAME}' REGISTRY_PASSWORD_B64='${REGISTRY_PASSWORD_B64}' REGISTRY_NAMESPACE='${REGISTRY_NAMESPACE}' NEXT_PUBLIC_API_URL='${NEXT_PUBLIC_API_URL}' NEXT_PUBLIC_API_HOST='${NEXT_PUBLIC_API_HOST}' NEXT_PUBLIC_UMAMI_WEBSITE_ID='${NEXT_PUBLIC_UMAMI_WEBSITE_ID}'; bash -s" \
            <<'EOF_REMOTE'
          set -euo pipefail

          if [ ! -d "${DOCKERNODE_PATH}/.git" ]; then
            mkdir -p "$(dirname "${DOCKERNODE_PATH}")"
            git clone "${REPO_URL}" "${DOCKERNODE_PATH}"
          fi

          cd "${DOCKERNODE_PATH}"
          git fetch --all --prune
          git checkout --detach "${TARGET_SHA}"

          REGISTRY_PASSWORD="$(printf '%s' "${REGISTRY_PASSWORD_B64}" | base64 -d)"
          echo "Validating registry endpoint https://${REGISTRY_HOST}/v2/"
          curl -fsS --connect-timeout 10 "https://${REGISTRY_HOST}/v2/" >/dev/null || true
          echo "${REGISTRY_PASSWORD}" | podman login "${REGISTRY_HOST}" -u "${REGISTRY_USERNAME}" --password-stdin

          echo "=== Building version: ${VERSION} ==="

          API_IMAGE_SHA="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/hoopnerd-api:${IMAGE_TAG}"
          API_IMAGE_LATEST="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/hoopnerd-api:main-latest"
          API_IMAGE_VERSION="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/hoopnerd-api:${VERSION}"
          WEB_IMAGE_SHA="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/hoopnerd-web:${IMAGE_TAG}"
          WEB_IMAGE_LATEST="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/hoopnerd-web:main-latest"
          WEB_IMAGE_VERSION="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/hoopnerd-web:${VERSION}"

          podman build \
            --platform linux/amd64 \
            --file apps/api/Dockerfile \
            --build-arg APP_VERSION="${VERSION}" \
            --build-arg GIT_SHA="${GIT_SHA}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            --tag "${API_IMAGE_SHA}" \
            --tag "${API_IMAGE_LATEST}" \
            --tag "${API_IMAGE_VERSION}" \
            .
          podman push "${API_IMAGE_SHA}"
          podman push "${API_IMAGE_LATEST}"
          podman push "${API_IMAGE_VERSION}"

          podman build \
            --platform linux/amd64 \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}" \
            --build-arg NEXT_PUBLIC_API_HOST="${NEXT_PUBLIC_API_HOST}" \
            --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID="${NEXT_PUBLIC_UMAMI_WEBSITE_ID}" \
            --build-arg NEXT_PUBLIC_APP_VERSION="${VERSION}" \
            --tag "${WEB_IMAGE_SHA}" \
            --tag "${WEB_IMAGE_LATEST}" \
            --tag "${WEB_IMAGE_VERSION}" \
            .
          podman push "${WEB_IMAGE_SHA}"
          podman push "${WEB_IMAGE_LATEST}"
          podman push "${WEB_IMAGE_VERSION}"
          EOF_REMOTE

      - name: Skip build (redeploy existing tag)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}
        run: |
          set -euo pipefail
          echo "Skipping image build. Using existing tag: ${{ steps.resolve_image_tag.outputs.image_tag }}"

  deploy_prod:
    if: github.ref == 'refs/heads/main'
    needs:
      - test
      - build_images_prod
    runs-on:
      - linux-amd64
    outputs:
      version: ${{ steps.resolve_version.outputs.version }}
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://${repo_host}/${GITHUB_REPOSITORY}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "${repo_url}"
          else
            git remote set-url origin "${repo_url}"
          fi
          # Fetch tags too — needed for version.sh to resolve semver
          git fetch --tags origin main
          git checkout --detach FETCH_HEAD

      - name: Resolve version
        id: resolve_version
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          VERSION="$(bash scripts/version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Deploy to Racknerd over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PATH_ON_VPS: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE || vars.REGISTRY_NAMESPACE }}
          IMAGE_TAG: ${{ needs.build_images_prod.outputs.image_tag }}
          APP_VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${IMAGE_TAG:?IMAGE_TAG is required}"
          : "${APP_VERSION:?APP_VERSION is required}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          key_file=~/.ssh/prod_deploy_key
          # Decode base64 if the key was stored encoded (starts with LS0t = "---" in b64)
          if printf '%s' "${DEPLOY_SSH_KEY}" | grep -q '^LS0t'; then
            printf '%s' "${DEPLOY_SSH_KEY}" | base64 -d > "${key_file}"
            printf '\n' >> "${key_file}"
          else
            printf '%s\n' "${DEPLOY_SSH_KEY}" > "${key_file}"
          fi
          chmod 600 "${key_file}"

          # Fail loud if any required input is missing
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${REGISTRY_URL:?REGISTRY_URL is required}"
          : "${REGISTRY_USERNAME:?REGISTRY_USERNAME is required}"
          : "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD is required}"
          : "${REGISTRY_NAMESPACE:?REGISTRY_NAMESPACE is required}"
          if [ ! -f scripts/deploy-quadlet.sh ]; then
            echo "ERROR: scripts/deploy-quadlet.sh is missing from the checkout" >&2
            exit 1
          fi

          echo "Deploying version: ${APP_VERSION}"

          # Base64-encode password to safely pass via shell export (matching build job)
          REGISTRY_PASSWORD_B64="$(printf '%s' "${REGISTRY_PASSWORD}" | base64 | tr -d '\n')"

          # Embed the deploy script as base64 and deliver it over SSH via a heredoc -- the
          # exact same transport build_images_prod uses successfully. We deliberately do
          # NOT use `ssh ... < scripts/deploy-quadlet.sh`, because on this runner that
          # stdin file-redirect delivers an empty stdin to the remote `bash -s`, which
          # exits 0 immediately and is reported as a 6-second "success" with zero work
          # done (the bug we are fixing).
          DEPLOY_SCRIPT_B64="$(base64 < scripts/deploy-quadlet.sh | tr -d '\n')"

          DEPLOY_LOG="$(mktemp)"
          trap 'rm -f "${DEPLOY_LOG}"' EXIT

          # Disable errexit around ssh so we always reach the sentinel check below,
          # even if the remote returns non-zero.
          set +e
          ssh -i "${key_file}" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export DEPLOY_PATH='${DEPLOY_PATH}' PATH_ON_VPS='${PATH_ON_VPS}' TARGET_SHA='${GITHUB_SHA}' IMAGE_TAG='${IMAGE_TAG}' APP_VERSION='${APP_VERSION}' REGISTRY_URL='${REGISTRY_URL}' REGISTRY_USERNAME='${REGISTRY_USERNAME}' REGISTRY_PASSWORD_B64='${REGISTRY_PASSWORD_B64}' REGISTRY_NAMESPACE='${REGISTRY_NAMESPACE}' DEPLOY_SCRIPT_B64='${DEPLOY_SCRIPT_B64}'; bash -s" \
            >"${DEPLOY_LOG}" 2>&1 <<'EOF_REMOTE'
          set -euo pipefail
          echo "=== remote bootstrap: host=$(hostname 2>/dev/null || echo unknown) ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) pid=$$ ==="
          tmp_script="$(mktemp)"
          trap 'rm -f "${tmp_script}"' EXIT
          printf '%s' "${DEPLOY_SCRIPT_B64}" | base64 -d > "${tmp_script}"
          chmod +x "${tmp_script}"
          bash "${tmp_script}"
          echo "=== remote bootstrap: done ==="
          EOF_REMOTE
          SSH_RC=$?
          set -e

          # Always surface whatever the remote produced
          cat "${DEPLOY_LOG}"

          # Sentinel guard: deploy-quadlet.sh prints "=== deploy-quadlet starting ==="
          # as its very first action. If that line is absent, the remote never executed
          # the script (silent no-op) -- refuse to report success.
          if ! grep -q '=== deploy-quadlet starting ===' "${DEPLOY_LOG}"; then
            echo "=== DEPLOY DID NOT RUN: sentinel line not found in remote output (ssh rc=${SSH_RC}) ===" >&2
            echo "The deploy script never executed on the VPS. See captured output above." >&2
            exit 1
          fi

          if [ "${SSH_RC}" -ne 0 ]; then
            echo "=== DEPLOY FAILED: remote exited with code ${SSH_RC} ===" >&2
            exit "${SSH_RC}"
          fi

          echo "=== deploy_prod complete ==="

      - name: Verify public endpoints
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 https://api.hoopnerd.xyz/health >/dev/null && curl -fsS --max-time 15 https://hoopnerd.xyz/ >/dev/null; then
              echo "Public endpoints healthy"
              exit 0
            fi
            echo "Endpoints not ready yet (attempt ${i}/6), waiting 10s..."
            sleep 10
          done
          echo "Public endpoint verification failed" >&2
          exit 1

      - name: Tag release
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          VERSION="${{ steps.resolve_version.outputs.version }}"
          TAG_NAME="v${VERSION}"

          # Check if this tag already exists (e.g., on retry)
          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists — skipping"
            exit 0
          fi

          # Authenticate git push using the auto-provisioned GITHUB_TOKEN
          REPO_URL_WITH_TOKEN="https://git:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "${REPO_URL_WITH_TOKEN}"

          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"
          echo "Created and pushed tag ${TAG_NAME}"
