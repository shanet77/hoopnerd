packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

catalog:
  # Shared toolchain & testing
  typescript: 6.0.2
  vitest: ^4.1.11
  "@types/node": ^25.9.9

  # Database
  pg: ^8.23.1
  "@types/pg": ^8.23.1

  # Frontend & UI
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  lucide-react: ^1.55.0
  jsdom: ^29.1.1
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^6.10.0

  # Socket
  socket.io-client: ^4.8.4

